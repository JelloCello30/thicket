name: Deploy site to GitHub Pages

# The marketing site (home, pricing, privacy, terms, download) is exported as
# static files and served from Pages. The full app — auth, sync, billing — needs
# a server and is NOT part of this deployment; see apps/web/scripts/build-static.mjs.
#
# The Chrome Web Store listing requires a reachable privacy-policy URL, and this
# is what serves it.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# The job commits the built site to the gh-pages branch, so it needs write
# access to repository contents. (It was `contents: read`, which builds fine
# and then fails on the push — the site never updated.)
permissions:
  contents: write

# Never let two deploys race; always finish the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — package.json's "packageManager" field
      # is the single source of truth, and specifying both fails the run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static marketing site
        working-directory: apps/web
        env:
          # Project Pages are served from /<repo>, so the site is built with
          # that base path and an absolute URL for sitemap/robots/OG tags.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/build-static.mjs

      # Publish by committing the built site to the gh-pages branch. This works
      # under either Pages source setting — "Deploy from a branch: gh-pages" or
      # "GitHub Actions" — and needs no permission the default token lacks.
      # (configure-pages with enablement: true fails with "Resource not
      # accessible by integration"; GITHUB_TOKEN may not create a Pages site.)
      - name: Publish to gh-pages
        working-directory: apps/web/out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy site from ${GITHUB_SHA::7}" || {
            echo "Nothing changed in the built site; skipping deploy."
            exit 0
          }
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
